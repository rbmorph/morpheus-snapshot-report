name: Build plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle downloads and checks the wrapper jar is genuine.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew jar --no-daemon

      - name: Check the jar
        id: jar
        run: |
          jar=$(ls build/libs/*.jar)
          echo "Built $jar"
          # Manifest lines wrap at 72 characters; join them back up before checking.
          unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n //g' | tee manifest.txt
          grep -q '^Plugin-Class: com.custom.morpheus.snapshotreport.TenantSnapshotReportPlugin' manifest.txt
          unzip -l "$jar" | grep -q 'renderer/hbs/tenantSnapshots.hbs'
          version=$(grep '^Plugin-Version:' manifest.txt | cut -d' ' -f2 | tr -d '\r')
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tenant-snapshot-report-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check tag matches the build version
        run: |
          jar=$(ls dist/*.jar)
          expected="dist/tenant-snapshot-report-${GITHUB_REF_NAME#v}.jar"
          if [ "$jar" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in build.gradle ($jar)"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
